version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isi_burger_app
    restart: unless-stopped
    environment:
      APP_NAME: "ISI BURGER"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: isi_burger
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-19732580}
      MAIL_MAILER: smtp
      MAIL_HOST: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USERNAME: ${MAIL_USERNAME:-e621cd7622881e}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-185229d741b1da}
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: noreply@isiburger.com
      MAIL_FROM_NAME: "ISI BURGER"
      FILESYSTEM_DISK: public
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - app_storage:/var/www/html/storage/app/public
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isi_burger_network

  postgres:
    image: postgres:15-alpine
    container_name: isi_burger_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: isi_burger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-19732580}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isi_burger"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isi_burger_network

volumes:
  postgres_data:
  app_storage:

networks:
  isi_burger_network:
    driver: bridge