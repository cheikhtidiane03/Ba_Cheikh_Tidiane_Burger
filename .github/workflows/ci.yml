name: ISI BURGER — CI/CD Pipeline

on:
  push:
    branches:
      - Cheikh-Tidiane-Ba
  pull_request:
    branches:
      - Cheikh-Tidiane-Ba

jobs:

  # ══════════════════════════════════════
  # JOB 1 — Installation dépendances Laravel
  # ══════════════════════════════════════
  install-and-test:
    name: 📦 Installation dépendances Laravel
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: isi_burger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Pull du code depuis GitHub
        uses: actions/checkout@v4

      - name: 🐘 Configuration PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, gd, zip, bcmath, mbstring, xml

      - name: 📦 Installation des dépendances PHP (Composer)
        run: |
          echo "📦 Installation Composer..."
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          echo "✅ Composer OK"

      - name: 🎨 Installation des dépendances JS + Build assets
        run: |
          echo "🎨 Installation npm..."
          npm ci
          echo "🔨 Build Tailwind/Vite..."
          npm run build
          echo "✅ Assets compilés"

      - name: ⚙️ Configuration environnement (.env)
        run: |
          cp .env.example .env

          # Configurer la clé
          php artisan key:generate

          # Configurer PostgreSQL
          cat >> .env << 'EOF'
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=isi_burger
          DB_USERNAME=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

          echo "✅ .env configuré"

      - name: 🗄️ Migration de la base de données
        run: |
          php artisan migrate --force
          echo "✅ Migrations OK"

      - name: ✅ Vérification finale
        run: php artisan about

  # ══════════════════════════════════════
  # JOB 2 — Création image Docker
  # ══════════════════════════════════════
  build-docker:
    name: 🐳 Création image Docker
    runs-on: ubuntu-latest
    needs: install-and-test

    steps:
      - name: 📥 Pull du code depuis GitHub
        uses: actions/checkout@v4

      - name: 🔍 Vérification des fichiers Docker
        run: |
          echo "=== Fichiers présents ==="
          ls -la
          echo "=== Dossier docker/ ==="
          ls -la docker/ 2>/dev/null || echo "⚠️  Créer le dossier docker/"

      - name: 🐳 Création de l'image Docker
        run: |
          echo "🐳 Build de l'image isi-burger..."
          docker build \
            --no-cache \
            --tag isi-burger:latest \
            --tag isi-burger:${{ github.sha }} \
            .
          echo "✅ Image créée !"

      - name: 📋 Résumé du build
        run: |
          docker images isi-burger
          echo "## ✅ Pipeline ISI BURGER réussi !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | isi-burger:latest |" >> $GITHUB_STEP_SUMMARY