name: ISI BURGER — CI/CD Pipeline

on:
  push:
    branches:
      - Cheikh-Tidiane-Ba
      - main
  pull_request:
    branches:
      - Cheikh-Tidiane-Ba

jobs:

  test:
    name: Code
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: isi_burger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, gd, zip, bcmath

      - name: Composer install
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: npm install + build
        run: |
          npm ci
          npm run build

      - name: Configuration .env
        run: |
          cp .env.example .env
          php artisan key:generate

          # Configurer PostgreSQL
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|^#.*DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^#.*DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|^#.*DB_DATABASE=.*|DB_DATABASE=isi_burger|' .env
          sed -i 's|^#.*DB_USERNAME=.*|DB_USERNAME=postgres|' .env
          sed -i 's|^#.*DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|' .env

          # Afficher pour debug (sans mot de passe)
          grep "DB_" .env | grep -v PASSWORD

      - name: Migrations
        run: php artisan migrate --force

      - name: Vérification
        run: php artisan about

  build-docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Vérifier que docker/ existe
        run: |
          ls -la docker/ || echo "Dossier docker/ manquant"
          ls -la Dockerfile || echo "Dockerfile manquant"

      - name: 🐳 Build image Docker
        run: |
          docker build \
            --no-cache \
            --tag isi-burger:${{ github.sha }} \
            --tag isi-burger:latest \
            .

      - name: Vérifier l'image
        run: |
          docker images isi-burger
          echo "## Image Docker créée !" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** isi-burger:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY