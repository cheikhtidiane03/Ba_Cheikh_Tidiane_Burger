# ══════════════════════════════════════════════════
#  ISI BURGER — GitHub Actions CI/CD
#  Version simplifiée pour débutant
# ══════════════════════════════════════════════════

name: ISI BURGER — CI/CD Pipeline

on:
  push:
    branches:
      - Cheikh-Tidiane-Ba
      - main
  pull_request:
    branches:
      - Cheikh-Tidiane-Ba

jobs:

  # ══════════════════════════════════════
  # JOB 1 : Tests
  # ══════════════════════════════════════
  test:
    name: 🧪 Tests Laravel
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: isi_burger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐘 Configuration PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, gd, zip, bcmath

      - name: 📦 Installation Composer
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: 🎨 Installation npm + build assets
        run: |
          npm ci
          npm run build

      - name: ⚙️ Configuration .env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/# DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/# DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/# DB_DATABASE=.*/DB_DATABASE=isi_burger/' .env
          sed -i 's/# DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/# DB_PASSWORD=.*/DB_PASSWORD=secret/' .env

      - name: 🗄️ Migration base de données
        run: php artisan migrate --force

      - name: ✅ Vérification
        run: php artisan about

  # ══════════════════════════════════════
  # JOB 2 : Build image Docker
  # ══════════════════════════════════════
  build-docker:
    name: 🐳 Build image Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Build de l'image Docker
        run: |
          docker build -t isi-burger:latest .
          echo "✅ Image Docker buildée avec succès"
          docker images isi-burger

      - name: 📋 Résumé
        run: |
          echo "## ✅ Build réussi !" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY